name: APK Derle

on:
  push:
    branches: [hizli-donus]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk HizliDonus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HizliDonus-apk
          path: HizliDonus.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hizli-donus-v${{ github.run_number }}
          name: Hızlı Dönüş v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: HizliDonus.apk
          body: Telefona indirip kur — HizliDonus.apk
