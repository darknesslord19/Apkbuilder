plugins { id 'com.android.application' }

android {
    namespace 'com.darknesslord.hizlidonus'
    compileSdk 34

    defaultConfig {
        applicationId 'com.darknesslord.hizlidonus'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/app.jks')
            storePassword 'hizlidonus'
            keyAlias 'hizlidonus'
            keyPassword 'hizlidonus'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
